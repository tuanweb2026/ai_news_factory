<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <rect width="1080" height="1920" fill="#070A0F"/>
  <rect x="80" y="160" width="920" height="60" rx="12" fill="#0D121A" stroke="#1E2A38"/>
  <text x="120" y="200" font-family="sans-serif" font-size="24" font-weight="bold" fill="#4DEBFF" letter-spacing="2">AI NEWS FACTORY • VOICE BENCHMARK</text>
