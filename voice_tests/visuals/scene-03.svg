  <text x="340" y="660" font-family="sans-serif" font-size="26" font-weight="bold" fill="#4DEBFF" text-anchor="middle">STATE VECTOR</text>
  <text x="340" y="720" font-family="monospace" font-size="20" fill="#8B98A7" text-anchor="middle">s = [0.41, 0.88, ...]</text>
  <rect x="580" y="600" width="320" height="440" rx="16" fill="#162030" stroke="#9B7CFF" stroke-width="2"/>
  <text x="740" y="660" font-family="sans-serif" font-size="26" font-weight="bold" fill="#9B7CFF" text-anchor="middle">ACTION VECTOR</text>
  <text x="740" y="720" font-family="monospace" font-size="20" fill="#8B98A7" text-anchor="middle">a = [0.93, 0.12, ...]</text>
  <line x1="500" y1="800" x2="580" y2="800" stroke="#54E39A" stroke-width="4"/>
  <text x="540" y="780" font-family="sans-serif" font-size="18" font-weight="bold" fill="#54E39A" text-anchor="middle">SIM</text>
  <!-- On Screen Text -->
  <rect x="120" y="1300" width="840" height="110" rx="16" fill="#0D121A" stroke="#4DEBFF" stroke-width="2"/>
  <text x="540" y="1370" font-family="sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle">DIRECT VECTOR COMPARISON</text>
