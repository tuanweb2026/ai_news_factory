<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <rect width="1080" height="1920" fill="#070A0F"/>
  <rect x="80" y="160" width="920" height="60" rx="12" fill="#0D121A" stroke="#1E2A38"/>
  <text x="120" y="200" font-family="sans-serif" font-size="24" font-weight="bold" fill="#4DEBFF" letter-spacing="2">AI NEWS FACTORY • VOICE BENCHMARK</text>
  <!-- Agent Architecture -->
  <rect x="100" y="500" width="880" height="720" rx="24" fill="#0D121A" stroke="#26354A" stroke-width="2"/>
  <rect x="160" y="560" width="760" height="120" rx="16" fill="#162030" stroke="#54E39A" stroke-width="2"/>
  <text x="540" y="630" font-family="sans-serif" font-size="32" font-weight="bold" fill="#54E39A" text-anchor="middle">AUTONOMOUS AGENT LAYER</text>
  <!-- Decision Nodes -->
  <circle cx="300" cy="880" r="70" fill="#1B2433" stroke="#4DEBFF" stroke-width="3"/>
  <text x="300" y="890" font-family="sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">PERCEIVE</text>
  <circle cx="540" cy="880" r="70" fill="#1B2433" stroke="#9B7CFF" stroke-width="3"/>
  <text x="540" y="890" font-family="sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">DECIDE</text>
  <circle cx="780" cy="880" r="70" fill="#1B2433" stroke="#54E39A" stroke-width="3"/>
  <text x="780" y="890" font-family="sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">ACT</text>
  <line x1="370" y1="880" x2="470" y2="880" stroke="#8B98A7" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="610" y1="880" x2="710" y2="880" stroke="#8B98A7" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- On Screen Text -->
  <rect x="120" y="1300" width="840" height="110" rx="16" fill="#0D121A" stroke="#4DEBFF" stroke-width="2"/>
  <text x="540" y="1370" font-family="sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle">AGENT DECISION PIPELINE</text>
</svg>