<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Background Space Radial Glow -->
    <radialGradient id="spaceGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0E1B2A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#070A0F" stop-opacity="1"/>
    </radialGradient>

    <!-- Hairline Gradients -->
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4DEBFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4DEBFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4DEBFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="violetLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B7CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9B7CFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9B7CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldKapton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC837"/>
      <stop offset="50%" stop-color="#FF8008"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="thermalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5C70"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FFF275"/>
    </linearGradient>
    <linearGradient id="solarWingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="50%" stop-color="#1f3160"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
  </defs>

  <!-- Canvas Deep Void -->
  <rect width="1080" height="1920" fill="#070A0F"/>
  <rect width="1080" height="1920" fill="url(#spaceGlow)"/>

  <!-- Technical Background Grid -->
  <g stroke="#131B26" stroke-width="1" opacity="0.6">
    <line x1="80" y1="0" x2="80" y2="1920"/>
    <line x1="540" y1="0" x2="540" y2="1920"/>
    <line x1="1000" y1="0" x2="1000" y2="1920"/>
    <line x1="0" y1="200" x2="1080" y2="200"/>
    <line x1="0" y1="440" x2="1080" y2="440"/>
    <line x1="0" y1="1300" x2="1080" y2="1300"/>
    <line x1="0" y1="1680" x2="1080" y2="1680"/>
  </g>

  <!-- Top Header Zone (Safe Margin: Y=140-200) -->
  <g transform="translate(80, 160)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#4DEBFF" letter-spacing="3">
      AI NEWS FACTORY
    </text>
    <text x="920" y="0" font-family="'Space Grotesk', monospace" font-size="20" font-weight="600" fill="#8B98A7" text-anchor="end" letter-spacing="1">
      PROJECT SUNCATCHER • ORBITAL TPU
    </text>
    <line x1="0" y1="22" x2="920" y2="22" stroke="url(#cyanLine)" stroke-width="2"/>
  </g>

  <!-- Shot Identification & Visual Status Pill -->
  <g transform="translate(540, 260)">
    <rect x="-300" y="-24" width="600" height="48" rx="24" fill="#0D121A" stroke="#FF5C70" stroke-width="1.5"/>
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#F3F7FA" text-anchor="middle" dominant-baseline="central" letter-spacing="2">
      SHOT-05 • THERMAL PHYSICS LIMIT
    </text>
  </g>

  <!-- MAIN VISUAL STAGE (Y=320 to Y=1280) -->
  <g id="main-visual-stage">
    
    <!-- Vacuum Thermal Trap Simulation -->
    <g transform="translate(100, 360)">
      <!-- Outer Vacuum Chamber Representation -->
      <rect width="880" height="520" rx="16" fill="#0A0E17" stroke="#1E2A38" stroke-width="2"/>

      <!-- Vacuum Void Tag -->
      <g transform="translate(40, 40)">
        <rect width="360" height="40" rx="6" fill="#131B26"/>
        <text x="20" y="25" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" fill="#8B98A7">
          ENVIRONMENT: SPACE VACUUM (DENSITY ≈ 0)
        </text>
      </g>

      <!-- Silicon Die Heat Map (Cross-Section) -->
      <g transform="translate(140, 160)">
        <!-- Base Substrate -->
        <rect width="360" height="240" rx="8" fill="#151E2B" stroke="#25354D" stroke-width="2"/>
        <!-- Concentric Thermal Heat Gradients (Core Escalating Heat) -->
        <rect x="30" y="30" width="300" height="180" rx="6" fill="#4A181C" opacity="0.8"/>
        <rect x="60" y="55" width="240" height="130" rx="6" fill="#872228" opacity="0.9"/>
        <rect x="95" y="80" width="170" height="80" rx="4" fill="#FF5C70"/>
        <rect x="130" y="95" width="100" height="50" rx="4" fill="#FFB300"/>

        <text x="180" y="126" font-family="'Inter', sans-serif" font-size="16" font-weight="900" fill="#070A0F" text-anchor="middle">
          TPU CORE
        </text>
        <text x="180" y="295" font-family="'Space Grotesk', monospace" font-size="15" font-weight="700" fill="#FF5C70" text-anchor="middle">
          TRAPPED DIE HEAT: JUNCTION RISES
        </text>
      </g>

      <!-- Bold Prohibition: No Convective Fans -->
      <g transform="translate(560, 160)">
        <rect width="280" height="240" rx="8" fill="#1B1215" stroke="#FF5C70" stroke-width="2"/>
        <!-- Stylized Fan Icon -->
        <circle cx="140" cy="95" r="50" fill="none" stroke="#8B98A7" stroke-width="4"/>
        <path d="M 140 45 Q 165 70 140 95 Q 115 120 140 145" fill="none" stroke="#8B98A7" stroke-width="4"/>
        <path d="M 90 95 Q 115 120 140 95 Q 165 70 190 95" fill="none" stroke="#8B98A7" stroke-width="4"/>

        <!-- Bold Red Diagonal Strikeout -->
        <line x1="75" y1="30" x2="205" y2="160" stroke="#FF5C70" stroke-width="8" stroke-linecap="round"/>

        <text x="140" y="195" font-family="'Inter', sans-serif" font-size="16" font-weight="900" fill="#FF5C70" text-anchor="middle">
          NO CONVECTIVE FANS
        </text>
        <text x="140" y="220" font-family="'Space Grotesk', monospace" font-size="13" font-weight="600" fill="#8B98A7" text-anchor="middle">
          NO AIR IN VACUUM
        </text>
      </g>

      <!-- Thermodynamics Rule Cards -->
      <g transform="translate(0, 560)">
        <g transform="translate(0, 0)">
          <rect width="420" height="150" rx="10" fill="#0D121A" stroke="#1E2A38" stroke-width="1.5"/>
          <text x="24" y="38" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" fill="#FF5C70">
            CONVECTIVE COOLING
          </text>
          <text x="24" y="80" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#F3F7FA">
            h = 0.0 W/m²·K
          </text>
          <text x="24" y="118" font-family="'Space Grotesk', monospace" font-size="14" fill="#8B98A7">
            Zero air molecules to carry away heat
          </text>
        </g>
        <g transform="translate(460, 0)">
          <rect width="420" height="150" rx="10" fill="#0D121A" stroke="#4DEBFF" stroke-width="1.5"/>
          <text x="24" y="38" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" fill="#4DEBFF">
            CONDUCTION ONLY
          </text>
          <text x="24" y="80" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#F3F7FA">
            COPPER HEAT PIPES
          </text>
          <text x="24" y="118" font-family="'Space Grotesk', monospace" font-size="14" fill="#8B98A7">
            Heat must travel through solid metals
          </text>
        </g>
      </g>
    </g>
    
  </g>

  <!-- PRIMARY TEXT CARD (Safe Upper-Middle Zone: Y=1320-1560) -->
  <g transform="translate(80, 1340)">
    <rect width="920" height="230" rx="16" fill="#0D121A" stroke="#1E2A38" stroke-width="2"/>

    <!-- Accent Corner Brackets -->
    <path d="M 0 30 L 0 0 L 30 0" fill="none" stroke="#4DEBFF" stroke-width="3"/>
    <path d="M 920 30 L 920 0 L 890 0" fill="none" stroke="#4DEBFF" stroke-width="3"/>
    <path d="M 0 200 L 0 230 L 30 230" fill="none" stroke="#4DEBFF" stroke-width="3"/>
    <path d="M 920 200 L 920 230 L 890 230" fill="none" stroke="#4DEBFF" stroke-width="3"/>

    <!-- Status Sub-pill -->
    <g transform="translate(460, 42)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#070A0F" stroke="#FF5C70" stroke-width="1"/>
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FF5C70" text-anchor="middle" dominant-baseline="central" letter-spacing="1.5">
        DIAGRAM • VACUUM THERMODYNAMICS
      </text>
    </g>

    <!-- Central Primary Card Text (Strictly max 6 words per card) -->
    <text x="460" y="125" font-family="'Inter', sans-serif" font-size="50" font-weight="900" fill="#F3F7FA" text-anchor="middle" letter-spacing="1">
      VACUUM HEAT TRAP • NO CONVECTION
    </text>

    <!-- Technical Subtext / Engineering Context -->
    <text x="460" y="185" font-family="'Space Grotesk', monospace" font-size="22" font-weight="500" fill="#8B98A7" text-anchor="middle" letter-spacing="0.5">
      ZERO AIR IN SPACE • SOLID CONDUCTION ONLY (NO FANS)
    </text>
  </g>

  <!-- Optional Watermark / Extra Guardrail Banner (Y=1600-1680) -->
  

  <!-- Channel Footer Stamp (Y=1780-1840) -->
  <g transform="translate(540, 1820)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#8B98A7" text-anchor="middle" letter-spacing="2">
      AI TECH EXPLAINER • VERIFIED EVIDENCE FIRST
    </text>
  </g>
</svg>