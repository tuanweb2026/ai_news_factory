<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Background Radial Depth Glow -->
    <radialGradient id="bioDepthGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0E1B2C" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#080E18" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070A0F" stop-opacity="1"/>
    </radialGradient>

    <!-- Glowing Lines -->
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4DEBFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4DEBFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4DEBFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="violetLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B7CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9B7CFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9B7CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mintLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#54E39A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#54E39A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#54E39A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB84D" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FFB84D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFB84D" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Card Subtle Drop Shadow -->
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1080" height="1920" fill="#070A0F"/>
  <rect width="1080" height="1920" fill="url(#bioDepthGlow)"/>

  <!-- Technical Scientific Coordinate Grid -->
  <g stroke="#141E2C" stroke-width="1" opacity="0.65">
    <line x1="80" y1="0" x2="80" y2="1920"/>
    <line x1="540" y1="0" x2="540" y2="1920"/>
    <line x1="1000" y1="0" x2="1000" y2="1920"/>
    <line x1="0" y1="180" x2="1080" y2="180"/>
    <line x1="0" y1="360" x2="1080" y2="360"/>
    <line x1="0" y1="1280" x2="1080" y2="1280"/>
    <line x1="0" y1="1650" x2="1080" y2="1650"/>
  </g>

  <!-- Top Header Banner (Safe Margin: Y=140-200) -->
  <g transform="translate(80, 160)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#4DEBFF" letter-spacing="3">
      AI NEWS FACTORY
    </text>
    <text x="920" y="0" font-family="'Space Grotesk', monospace" font-size="20" font-weight="600" fill="#8B98A7" text-anchor="end" letter-spacing="1">
      COMPUTATIONAL BIOLOGY • SHORT #2
    </text>
    <line x1="0" y1="20" x2="920" y2="20" stroke="url(#cyanLine)" stroke-width="2"/>
  </g>

  <!-- Shot Identification & Visual Status Pill (Y=240-290) -->
  <g transform="translate(540, 260)">
    <rect x="-310" y="-24" width="620" height="48" rx="24" fill="#0D121A" stroke="#FF5C70" stroke-width="1.8"/>
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="19" font-weight="700" fill="#F3F7FA" text-anchor="middle" dominant-baseline="central" letter-spacing="2">
      SHOT-05 • SCIENTIFIC BOUNDARY
    </text>
  </g>

  <!-- MAIN VISUAL STAGE (Y=320 to Y=1240) -->
  <g id="main-visual-stage">
    
    <g transform="translate(0, 0)">
      <!-- Splitting Boundary Frame: Warning Coral-Red vs Foundational Biology -->
      <!-- Left / Top Warning Shield: NOT HUMAN GENE EDITING -->
      <g transform="translate(100, 360)">
        <rect width="880" height="240" rx="16" fill="#1C0A0E" stroke="#FF5C70" stroke-width="3"/>

        <!-- Shield Icon & Prohibition Emblem -->
        <g transform="translate(80, 120)">
          <polygon points="0,-50 45,-25 45,25 0,55 -45,25 -45,-25" fill="#3D1219" stroke="#FF5C70" stroke-width="3"/>
          <line x1="-25" y1="-25" x2="25" y2="25" stroke="#FF5C70" stroke-width="4"/>
          <line x1="25" y1="-25" x2="-25" y2="25" stroke="#FF5C70" stroke-width="4"/>
        </g>

        <!-- Strong Text Refutation -->
        <text x="160" y="80" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="#FF5C70" letter-spacing="2">
          CRITICAL SCIENTIFIC BOUNDARY
        </text>
        <text x="160" y="125" font-family="'Space Grotesk', monospace" font-size="20" font-weight="700" fill="#F3F7FA">
          • NO HUMAN GENE-EDITING TOOL DEMONSTRATED
        </text>
        <text x="160" y="165" font-family="'Space Grotesk', monospace" font-size="20" font-weight="700" fill="#F3F7FA">
          • NOT A CLINICAL GENE THERAPY TREATMENT
        </text>
        <text x="160" y="200" font-family="'Space Grotesk', monospace" font-size="16" font-weight="600" fill="#8B98A7">
          EXPERIMENTAL DATA LIMITED TO BACTERIOPHAGE SYSTEMS
        </text>
      </g>

      <!-- Dividing Barrier Line -->
      <g transform="translate(100, 630)">
        <line x1="0" y1="0" x2="880" y2="0" stroke="#FF5C70" stroke-width="3" stroke-dasharray="12 12"/>
      </g>

      <!-- Bottom Frame: Expanding Foundational Biology Lattice -->
      <g transform="translate(100, 660)">
        <rect width="880" height="420" rx="16" fill="#0D121A" stroke="#4DEBFF" stroke-width="2.5"/>

        <!-- Header -->
        <text x="440" y="55" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#4DEBFF" text-anchor="middle" letter-spacing="2">
          WHAT THIS ACTUALLY IS: NEW BIOLOGICAL ARCHITECTURE
        </text>

        <!-- Conceptual Expanding DNA Lattice (Cyan & Violet) -->
        <g transform="translate(440, 230)">
          <!-- Cyan Molecular Helix Nodes -->
          <circle cx="-160" cy="-60" r="16" fill="#4DEBFF"/>
          <circle cx="-60" cy="-30" r="12" fill="#4DEBFF"/>
          <circle cx="60" cy="-60" r="16" fill="#4DEBFF"/>
          <circle cx="160" cy="-30" r="12" fill="#4DEBFF"/>

          <circle cx="-160" cy="40" r="14" fill="#9B7CFF"/>
          <circle cx="-60" cy="70" r="18" fill="#9B7CFF"/>
          <circle cx="60" cy="40" r="14" fill="#9B7CFF"/>
          <circle cx="160" cy="70" r="18" fill="#9B7CFF"/>

          <!-- Interconnected Lattice Bonds -->
          <line x1="-160" y1="-60" x2="-60" y2="-30" stroke="#4DEBFF" stroke-width="3"/>
          <line x1="-60" y1="-30" x2="60" y2="-60" stroke="#4DEBFF" stroke-width="3"/>
          <line x1="60" y1="-60" x2="160" y2="-30" stroke="#4DEBFF" stroke-width="3"/>

          <line x1="-160" y1="40" x2="-60" y2="70" stroke="#9B7CFF" stroke-width="3"/>
          <line x1="-60" y1="70" x2="60" y2="40" stroke="#9B7CFF" stroke-width="3"/>
          <line x1="60" y1="40" x2="160" y2="70" stroke="#9B7CFF" stroke-width="3"/>

          <!-- Cross Base-Pair Rungs -->
          <line x1="-160" y1="-60" x2="-160" y2="40" stroke="#54E39A" stroke-width="2.5"/>
          <line x1="-60" y1="-30" x2="-60" y2="70" stroke="#54E39A" stroke-width="2.5"/>
          <line x1="60" y1="-60" x2="60" y2="40" stroke="#54E39A" stroke-width="2.5"/>
          <line x1="160" y1="-30" x2="160" y2="70" stroke="#54E39A" stroke-width="2.5"/>
        </g>

        <!-- Descriptive Foundation Label -->
        <text x="440" y="375" font-family="'Space Grotesk', monospace" font-size="16" font-weight="700" fill="#54E39A" text-anchor="middle" letter-spacing="1.5">
          UNEXPLORED RETRON / REVERSE-TRANSCRIPTASE DOMAINS UNLOCKED
        </text>
      </g>
    </g>
    
  </g>

  
    <!-- Secondary Watermark Badge (Safe Zone) -->
    <g transform="translate(540, 1260)">
      <rect x="-310" y="-22" width="620" height="44" rx="22" fill="#140A10" stroke="#FF5C70" stroke-width="2"/>
      <circle cx="-275" cy="0" r="7" fill="#FF5C70"/>
      <text x="0" y="1" font-family="'Inter', sans-serif" font-size="19" font-weight="800" fill="#FF5C70" text-anchor="middle" dominant-baseline="central" letter-spacing="2">
        FUNDAMENTAL BIOLOGY • NO GENE EDITING
      </text>
    </g>


  <!-- PRIMARY TEXT CARD (Safe Upper-Middle Zone: Y=1330-1560) -->
  <g transform="translate(80, 1340)" filter="url(#cardGlow)">
    <rect width="920" height="220" rx="16" fill="#0D121A" stroke="#1E2A38" stroke-width="2"/>

    <!-- Accent Corner Brackets -->
    <path d="M 0 32 L 0 0 L 32 0" fill="none" stroke="#4DEBFF" stroke-width="3"/>
    <path d="M 920 32 L 920 0 L 888 0" fill="none" stroke="#4DEBFF" stroke-width="3"/>
    <path d="M 0 188 L 0 220 L 32 220" fill="none" stroke="#9B7CFF" stroke-width="3"/>
    <path d="M 920 188 L 920 220 L 888 220" fill="none" stroke="#9B7CFF" stroke-width="3"/>

    <!-- Primary Headline Card (Strictly <=6 words) -->
    <text x="460" y="95" font-family="'Inter', sans-serif" font-size="44" font-weight="900" fill="#F3F7FA" text-anchor="middle" letter-spacing="2">
      NOT GENE THERAPY • NEW BIOLOGY
    </text>

    <!-- Subtext Explainer -->
    <line x1="160" y1="130" x2="760" y2="130" stroke="url(#cyanLine)" stroke-width="1.5"/>
    <text x="460" y="172" font-family="'Space Grotesk', monospace" font-size="20" font-weight="600" fill="#8B98A7" text-anchor="middle" letter-spacing="2">
      STRICT DEMARCATION: BASIC BIOLOGY VS CLINICAL THERAPY
    </text>
  </g>

  <!-- Bottom Mandatory Disclosure & Safety Bar (Y=1680-1760) -->
  <g transform="translate(540, 1720)">
    <rect x="-380" y="-20" width="760" height="40" rx="8" fill="#0A0F17" stroke="#1B283A" stroke-width="1.2"/>
    <text x="0" y="1" font-family="'Space Grotesk', monospace" font-size="14" font-weight="600" fill="#8B98A7" text-anchor="middle" dominant-baseline="central" letter-spacing="1.5">
      SCIENTIFIC BOUNDARY DIAGRAM — BASIC SCIENCE ONLY
    </text>
  </g>
</svg>