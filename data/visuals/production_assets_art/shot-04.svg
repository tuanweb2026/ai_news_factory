<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Background Radial Depth Glow -->
    <radialGradient id="bioDepthGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0E1B2C" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#080E18" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070A0F" stop-opacity="1"/>
    </radialGradient>

    <!-- Glowing Lines -->
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4DEBFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4DEBFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4DEBFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="violetLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B7CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9B7CFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9B7CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mintLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#54E39A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#54E39A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#54E39A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB84D" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FFB84D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFB84D" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Card Subtle Drop Shadow -->
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1080" height="1920" fill="#070A0F"/>
  <rect width="1080" height="1920" fill="url(#bioDepthGlow)"/>

  <!-- Technical Scientific Coordinate Grid -->
  <g stroke="#141E2C" stroke-width="1" opacity="0.65">
    <line x1="80" y1="0" x2="80" y2="1920"/>
    <line x1="540" y1="0" x2="540" y2="1920"/>
    <line x1="1000" y1="0" x2="1000" y2="1920"/>
    <line x1="0" y1="180" x2="1080" y2="180"/>
    <line x1="0" y1="360" x2="1080" y2="360"/>
    <line x1="0" y1="1280" x2="1080" y2="1280"/>
    <line x1="0" y1="1650" x2="1080" y2="1650"/>
  </g>

  <!-- Top Header Banner (Safe Margin: Y=140-200) -->
  <g transform="translate(80, 160)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#4DEBFF" letter-spacing="3">
      AI NEWS FACTORY
    </text>
    <text x="920" y="0" font-family="'Space Grotesk', monospace" font-size="20" font-weight="600" fill="#8B98A7" text-anchor="end" letter-spacing="1">
      COMPUTATIONAL BIOLOGY • SHORT #2
    </text>
    <line x1="0" y1="20" x2="920" y2="20" stroke="url(#cyanLine)" stroke-width="2"/>
  </g>

  <!-- Shot Identification & Visual Status Pill (Y=240-290) -->
  <g transform="translate(540, 260)">
    <rect x="-310" y="-24" width="620" height="48" rx="24" fill="#0D121A" stroke="#FFB84D" stroke-width="1.8"/>
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="19" font-weight="700" fill="#F3F7FA" text-anchor="middle" dominant-baseline="central" letter-spacing="2">
      SHOT-04 • WET-LAB VERIFICATION
    </text>
  </g>

  <!-- MAIN VISUAL STAGE (Y=320 to Y=1240) -->
  <g id="main-visual-stage">
    
    <g transform="translate(0, 0)">
      <!-- Laboratory Staging Header -->
      <g transform="translate(100, 350)">
        <rect width="880" height="60" rx="10" fill="#0D121A" stroke="#FFB84D" stroke-width="2"/>
        <circle cx="35" cy="30" r="10" fill="#FFB84D"/>
        <text x="60" y="37" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#F3F7FA">
          SAN FRANCISCO WET LAB • IN-VITRO TRANSCRIPTION ASSAY
        </text>
        <text x="850" y="37" font-family="'Space Grotesk', monospace" font-size="15" font-weight="700" fill="#FFB84D" text-anchor="end">
          EXPERIMENTAL RECONSTRUCTION
        </text>
      </g>

      <!-- Polyacrylamide Gel Assay Visual Frame (Y=430-1080) -->
      <g transform="translate(140, 430)">
        <!-- Deep UV Transilluminator Dark Slab -->
        <rect width="800" height="620" rx="16" fill="#05080E" stroke="#1A2738" stroke-width="3"/>
        <rect width="800" height="620" rx="16" fill="url(#amberGlow)" opacity="0.12"/>

        <!-- Measurement Scale / Molecular Ladder (Left Lane) -->
        <g transform="translate(70, 40)">
          <text x="0" y="0" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" fill="#8B98A7">LADDER</text>
          <line x1="20" y1="30" x2="20" y2="530" stroke="#1F2E40" stroke-width="2"/>
          <!-- Scale markers -->
          <line x1="10" y1="70" x2="30" y2="70" stroke="#8B98A7" stroke-width="2"/>
          <text x="40" y="75" font-family="'Space Grotesk', monospace" font-size="12" fill="#8B98A7">500 nt</text>
          <line x1="10" y1="160" x2="30" y2="160" stroke="#8B98A7" stroke-width="2"/>
          <text x="40" y="165" font-family="'Space Grotesk', monospace" font-size="12" fill="#8B98A7">300 nt</text>
          <line x1="10" y1="280" x2="30" y2="280" stroke="#8B98A7" stroke-width="2"/>
          <text x="40" y="285" font-family="'Space Grotesk', monospace" font-size="12" fill="#8B98A7">150 nt</text>
          <line x1="10" y1="420" x2="30" y2="420" stroke="#FFB84D" stroke-width="3"/>
          <text x="40" y="425" font-family="'Space Grotesk', monospace" font-size="13" font-weight="800" fill="#FFB84D">SHORT RNA</text>
        </g>

        <!-- 4 Experimental Assay Lanes -->
        <!-- Lane 1: Negative Control (No Polymerase) -->
        <g transform="translate(230, 40)">
          <text x="45" y="0" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" fill="#8B98A7" text-anchor="middle">CONTROL</text>
          <rect x="0" y="20" width="90" height="520" fill="#080E17" stroke="#121D2C" stroke-width="1.5"/>
          <!-- No bands (negative control) -->
        </g>

        <!-- Lane 2: ART Array Substrate + In-Vitro Transcription -->
        <g transform="translate(360, 40)">
          <text x="45" y="0" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" fill="#FFB84D" text-anchor="middle">ASSAY A</text>
          <rect x="0" y="20" width="90" height="520" fill="#080E17" stroke="#FFB84D" stroke-width="1.8"/>
          <!-- Discrete Amber-Gold Fluorescent Bands -->
          <rect x="15" y="410" width="60" height="14" rx="4" fill="#FFB84D" opacity="0.95"/>
          <rect x="10" y="407" width="70" height="20" rx="6" fill="#FFB84D" opacity="0.35"/>
          <rect x="25" y="445" width="40" height="8" rx="2" fill="#FFB84D" opacity="0.7"/>
        </g>

        <!-- Lane 3: Replicate Validation -->
        <g transform="translate(490, 40)">
          <text x="45" y="0" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" fill="#FFB84D" text-anchor="middle">ASSAY B</text>
          <rect x="0" y="20" width="90" height="520" fill="#080E17" stroke="#FFB84D" stroke-width="1.8"/>
          <!-- Discrete Amber-Gold Fluorescent Bands -->
          <rect x="15" y="410" width="60" height="14" rx="4" fill="#FFB84D" opacity="0.95"/>
          <rect x="10" y="407" width="70" height="20" rx="6" fill="#FFB84D" opacity="0.35"/>
          <rect x="25" y="445" width="40" height="8" rx="2" fill="#FFB84D" opacity="0.7"/>
        </g>

        <!-- Lane 4: Reference Comparison -->
        <g transform="translate(620, 40)">
          <text x="45" y="0" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" fill="#54E39A" text-anchor="middle">PURIFIED</text>
          <rect x="0" y="20" width="90" height="520" fill="#080E17" stroke="#54E39A" stroke-width="1.5"/>
          <rect x="20" y="412" width="50" height="10" rx="3" fill="#54E39A" opacity="0.85"/>
        </g>

        <!-- Discrete Callout Arrow on Short RNA Band -->
        <g transform="translate(450, 480)">
          <line x1="50" y1="0" x2="160" y2="0" stroke="#FFB84D" stroke-width="2"/>
          <polygon points="40,0 55,-6 55,6" fill="#FFB84D"/>
          <rect x="170" y="-30" width="160" height="60" rx="8" fill="#0D121A" stroke="#FFB84D" stroke-width="1.5"/>
          <text x="250" y="-10" font-family="'Space Grotesk', monospace" font-size="12" font-weight="700" fill="#FFB84D" text-anchor="middle">DISCRETE READOUT</text>
          <text x="250" y="14" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#F3F7FA" text-anchor="middle">SHORT RNA</text>
        </g>
      </g>

      <!-- Conceptual Simulation Mandatory Disclosure Stamp -->
      <g transform="translate(540, 1140)">
        <rect x="-350" y="-22" width="700" height="44" rx="22" fill="#171108" stroke="#FFB84D" stroke-width="1.5"/>
        <text x="0" y="1" font-family="'Space Grotesk', monospace" font-size="15" font-weight="700" fill="#FFB84D" text-anchor="middle" dominant-baseline="central" letter-spacing="1">
          ORIGINAL SCIENTIFIC SIMULATION — NOT ORIGINAL EXPERIMENTAL DATA
        </text>
      </g>
    </g>
    
  </g>

  

  <!-- PRIMARY TEXT CARD (Safe Upper-Middle Zone: Y=1330-1560) -->
  <g transform="translate(80, 1340)" filter="url(#cardGlow)">
    <rect width="920" height="220" rx="16" fill="#0D121A" stroke="#1E2A38" stroke-width="2"/>

    <!-- Accent Corner Brackets -->
    <path d="M 0 32 L 0 0 L 32 0" fill="none" stroke="#4DEBFF" stroke-width="3"/>
    <path d="M 920 32 L 920 0 L 888 0" fill="none" stroke="#4DEBFF" stroke-width="3"/>
    <path d="M 0 188 L 0 220 L 32 220" fill="none" stroke="#9B7CFF" stroke-width="3"/>
    <path d="M 920 188 L 920 220 L 888 220" fill="none" stroke="#9B7CFF" stroke-width="3"/>

    <!-- Primary Headline Card (Strictly <=6 words) -->
    <text x="460" y="95" font-family="'Inter', sans-serif" font-size="44" font-weight="900" fill="#F3F7FA" text-anchor="middle" letter-spacing="2">
      WET-LAB VERIFIED • SHORT RNA
    </text>

    <!-- Subtext Explainer -->
    <line x1="160" y1="130" x2="760" y2="130" stroke="url(#cyanLine)" stroke-width="1.5"/>
    <text x="460" y="172" font-family="'Space Grotesk', monospace" font-size="20" font-weight="600" fill="#8B98A7" text-anchor="middle" letter-spacing="2">
      SAN FRANCISCO WET LAB CONFIRMS TRANSCRIPTION PRODUCTS
    </text>
  </g>

  <!-- Bottom Mandatory Disclosure & Safety Bar (Y=1680-1760) -->
  <g transform="translate(540, 1720)">
    <rect x="-380" y="-20" width="760" height="40" rx="8" fill="#0A0F17" stroke="#1B283A" stroke-width="1.2"/>
    <text x="0" y="1" font-family="'Space Grotesk', monospace" font-size="14" font-weight="600" fill="#8B98A7" text-anchor="middle" dominant-baseline="central" letter-spacing="1.5">
      ORIGINAL SCIENTIFIC SIMULATION — NOT ORIGINAL EXPERIMENTAL DATA
    </text>
  </g>
</svg>