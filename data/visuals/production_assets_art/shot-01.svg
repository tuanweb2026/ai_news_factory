<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Background Radial Depth Glow -->
    <radialGradient id="bioDepthGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0E1B2C" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#080E18" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070A0F" stop-opacity="1"/>
    </radialGradient>

    <!-- Glowing Lines -->
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4DEBFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4DEBFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4DEBFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="violetLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B7CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9B7CFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9B7CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mintLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#54E39A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#54E39A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#54E39A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB84D" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FFB84D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFB84D" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Card Subtle Drop Shadow -->
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1080" height="1920" fill="#070A0F"/>
  <rect width="1080" height="1920" fill="url(#bioDepthGlow)"/>

  <!-- Technical Scientific Coordinate Grid -->
  <g stroke="#141E2C" stroke-width="1" opacity="0.65">
    <line x1="80" y1="0" x2="80" y2="1920"/>
    <line x1="540" y1="0" x2="540" y2="1920"/>
    <line x1="1000" y1="0" x2="1000" y2="1920"/>
    <line x1="0" y1="180" x2="1080" y2="180"/>
    <line x1="0" y1="360" x2="1080" y2="360"/>
    <line x1="0" y1="1280" x2="1080" y2="1280"/>
    <line x1="0" y1="1650" x2="1080" y2="1650"/>
  </g>

  <!-- Top Header Banner (Safe Margin: Y=140-200) -->
  <g transform="translate(80, 160)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#4DEBFF" letter-spacing="3">
      AI NEWS FACTORY
    </text>
    <text x="920" y="0" font-family="'Space Grotesk', monospace" font-size="20" font-weight="600" fill="#8B98A7" text-anchor="end" letter-spacing="1">
      COMPUTATIONAL BIOLOGY • SHORT #2
    </text>
    <line x1="0" y1="20" x2="920" y2="20" stroke="url(#cyanLine)" stroke-width="2"/>
  </g>

  <!-- Shot Identification & Visual Status Pill (Y=240-290) -->
  <g transform="translate(540, 260)">
    <rect x="-310" y="-24" width="620" height="48" rx="24" fill="#0D121A" stroke="#4DEBFF" stroke-width="1.8"/>
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="19" font-weight="700" fill="#F3F7FA" text-anchor="middle" dominant-baseline="central" letter-spacing="2">
      SHOT-01 • THE BIOLOGICAL HOOK
    </text>
  </g>

  <!-- MAIN VISUAL STAGE (Y=320 to Y=1240) -->
  <g id="main-visual-stage">
    
    <!-- Deep Microbial Void Background -->
    <g transform="translate(0, 0)">
      <!-- Bacterial Membrane Curvature at Bottom of Stage -->
      <path d="M -50 1180 Q 540 1020 1130 1180 L 1130 1260 L -50 1260 Z" fill="#0E131F" opacity="0.95"/>
      <path d="M -50 1180 Q 540 1020 1130 1180" fill="none" stroke="#4DEBFF" stroke-width="6" opacity="0.85"/>
      <path d="M -50 1180 Q 540 1020 1130 1180" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>

      <!-- Computational Code Matrix Lattice (Upper Half) -->
      <g opacity="0.5" font-family="'Space Grotesk', monospace" font-size="16" fill="#4DEBFF">
        <text x="120" y="380">01000001 01010010 01010100 // ENZYME_SEARCH_INIT</text>
        <text x="120" y="415">fn scan_protein_clusters(db: &amp;Clusters) -&gt; Result&lt;RT_System&gt; &#123;</text>
        <text x="160" y="450">parallel_agents: 1000, target: "viral_capsid_rt"</text>
        <text x="160" y="485">let motifs = detect_crispr_like_tandem_repeats();</text>
        <text x="120" y="520">&#125; // 1.9 BILLION CLUSTERS FILTERED</text>
        <line x1="120" y1="540" x2="840" y2="540" stroke="url(#cyanLine)" stroke-width="1.5"/>
      </g>

      <!-- Folding Transformation Vector Rays -->
      <g stroke="#9B7CFF" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7">
        <line x1="260" y1="550" x2="540" y2="680"/>
        <line x1="820" y1="550" x2="540" y2="680"/>
        <line x1="540" y1="540" x2="540" y2="650"/>
      </g>

      <!-- 3D Master Bacteriophage Architecture (Center Stage) -->
      <g transform="translate(540, 780)">
        <!-- Faceted Icosahedral Capsid Head -->
        <!-- Center top triangle -->
        <polygon points="0,-180 -95,-100 0,-40" fill="#1F293D" stroke="#4DEBFF" stroke-width="2.5"/>
        <polygon points="0,-180 95,-100 0,-40" fill="#24334C" stroke="#4DEBFF" stroke-width="2.5"/>
        <polygon points="-95,-100 0,-40 -60,40" fill="#182335" stroke="#4DEBFF" stroke-width="2.5"/>
        <polygon points="95,-100 0,-40 60,40" fill="#2D3F5E" stroke="#4DEBFF" stroke-width="2.5"/>
        <polygon points="-60,40 0,-40 0,60" fill="#141E2E" stroke="#4DEBFF" stroke-width="2.5"/>
        <polygon points="60,40 0,-40 0,60" fill="#24334C" stroke="#4DEBFF" stroke-width="2.5"/>

        <!-- Glowing Viral Genomic Core (Internal Cyan Illumination) -->
        <circle cx="0" cy="-70" r="26" fill="#4DEBFF" opacity="0.35"/>
        <circle cx="0" cy="-70" r="14" fill="#4DEBFF" opacity="0.75"/>
        <text x="0" y="-64" font-family="'Space Grotesk', monospace" font-size="12" font-weight="700" fill="#070A0F" text-anchor="middle">DNA</text>

        <!-- Collar & Whiskers -->
        <rect x="-24" y="60" width="48" height="12" rx="4" fill="#3B4D6B" stroke="#4DEBFF" stroke-width="1.5"/>

        <!-- Contractile Helical Sheath -->
        <g stroke="#4DEBFF" stroke-width="2">
          <line x1="-16" y1="76" x2="16" y2="76"/>
          <line x1="-18" y1="94" x2="18" y2="94"/>
          <line x1="-18" y1="112" x2="18" y2="112"/>
          <line x1="-18" y1="130" x2="18" y2="130"/>
          <line x1="-18" y1="148" x2="18" y2="148"/>
          <line x1="-18" y1="166" x2="18" y2="166"/>
          <rect x="-14" y="72" width="28" height="100" fill="#0E131F" opacity="0.6"/>
        </g>

        <!-- Baseplate -->
        <polygon points="-32,176 32,176 22,192 -22,192" fill="#1F293D" stroke="#9B7CFF" stroke-width="2"/>
        <circle cx="0" cy="184" r="5" fill="#9B7CFF"/>

        <!-- 6 Articulating Tail Fibers Gripping Bacterial Wall -->
        <!-- Left 3 fibers -->
        <polyline points="-22,188 -90,210 -150,280 -180,330" fill="none" stroke="#4DEBFF" stroke-width="3" stroke-linecap="round"/>
        <polyline points="-16,188 -70,225 -105,300 -125,335" fill="none" stroke="#4DEBFF" stroke-width="3" stroke-linecap="round"/>
        <polyline points="-10,188 -45,235 -65,310 -75,340" fill="none" stroke="#4DEBFF" stroke-width="3" stroke-linecap="round"/>
        <!-- Right 3 fibers -->
        <polyline points="22,188 90,210 150,280 180,330" fill="none" stroke="#4DEBFF" stroke-width="3" stroke-linecap="round"/>
        <polyline points="16,188 70,225 105,300 125,335" fill="none" stroke="#4DEBFF" stroke-width="3" stroke-linecap="round"/>
        <polyline points="10,188 45,235 65,310 75,340" fill="none" stroke="#4DEBFF" stroke-width="3" stroke-linecap="round"/>

        <!-- Landing Anchor Contact Sparks -->
        <circle cx="-180" cy="330" r="5" fill="#54E39A"/>
        <circle cx="180" cy="330" r="5" fill="#54E39A"/>
        <circle cx="-75" cy="340" r="4" fill="#54E39A"/>
        <circle cx="75" cy="340" r="4" fill="#54E39A"/>
      </g>

      <!-- Technical Telemetry Badges -->
      <g transform="translate(120, 980)">
        <rect width="240" height="70" rx="8" fill="#0D121A" stroke="#1E2A38" stroke-width="1.5"/>
        <text x="20" y="28" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" fill="#4DEBFF">HOST ORGANISM</text>
        <text x="20" y="52" font-family="'Inter', sans-serif" font-size="17" font-weight="800" fill="#F3F7FA">JUMBO PHAGE VIRUS</text>
      </g>
      <g transform="translate(720, 980)">
        <rect width="240" height="70" rx="8" fill="#0D121A" stroke="#1E2A38" stroke-width="1.5"/>
        <text x="20" y="28" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" fill="#54E39A">TARGET SURFACE</text>
        <text x="20" y="52" font-family="'Inter', sans-serif" font-size="17" font-weight="800" fill="#F3F7FA">BACTERIAL ENVELOPE</text>
      </g>
    </g>
    
  </g>

  

  <!-- PRIMARY TEXT CARD (Safe Upper-Middle Zone: Y=1330-1560) -->
  <g transform="translate(80, 1340)" filter="url(#cardGlow)">
    <rect width="920" height="220" rx="16" fill="#0D121A" stroke="#1E2A38" stroke-width="2"/>

    <!-- Accent Corner Brackets -->
    <path d="M 0 32 L 0 0 L 32 0" fill="none" stroke="#4DEBFF" stroke-width="3"/>
    <path d="M 920 32 L 920 0 L 888 0" fill="none" stroke="#4DEBFF" stroke-width="3"/>
    <path d="M 0 188 L 0 220 L 32 220" fill="none" stroke="#9B7CFF" stroke-width="3"/>
    <path d="M 920 188 L 920 220 L 888 220" fill="none" stroke="#9B7CFF" stroke-width="3"/>

    <!-- Primary Headline Card (Strictly <=6 words) -->
    <text x="460" y="95" font-family="'Inter', sans-serif" font-size="44" font-weight="900" fill="#F3F7FA" text-anchor="middle" letter-spacing="2">
      AI DISCOVERS NEW BIOLOGY
    </text>

    <!-- Subtext Explainer -->
    <line x1="160" y1="130" x2="760" y2="130" stroke="url(#cyanLine)" stroke-width="1.5"/>
    <text x="460" y="172" font-family="'Space Grotesk', monospace" font-size="20" font-weight="600" fill="#8B98A7" text-anchor="middle" letter-spacing="2">
      COMPUTATIONAL SEARCH UNLOCKS VIRAL ENZYME SYSTEM
    </text>
  </g>

  <!-- Bottom Mandatory Disclosure & Safety Bar (Y=1680-1760) -->
  <g transform="translate(540, 1720)">
    <rect x="-380" y="-20" width="760" height="40" rx="8" fill="#0A0F17" stroke="#1B283A" stroke-width="1.2"/>
    <text x="0" y="1" font-family="'Space Grotesk', monospace" font-size="14" font-weight="600" fill="#8B98A7" text-anchor="middle" dominant-baseline="central" letter-spacing="1.5">
      CONCEPTUAL SCIENTIFIC VISUALIZATION — JUMBO PHAGE HOST
    </text>
  </g>
</svg>