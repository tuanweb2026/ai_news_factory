factory:
  name: AI NEWS FACTORY
  version: "2.0"
  timezone: Asia/Ho_Chi_Minh
  mode: SCHEDULED_AUTOPILOT

research:
  freshness_hours: 24
  minimum_source_confidence: 0.85
  require_primary_source_when_available: true
  independent_corroboration: true

video:
  aspect_ratio: "9:16"
  width: 1080
  height: 1920
  fps: 30
  target_duration_seconds: 30
  min_duration_seconds: 20
  max_duration_seconds: 40

style:
  bible: AI_NEWS_VISUAL_STYLE_BIBLE_v1.0.md
  palette:
    background: "#070A0F"
    panel: "#0D121A"
    text: "#F3F7FA"
    muted: "#8B98A7"
    cyan: "#4DEBFF"
    violet: "#9B7CFF"
    red: "#FF5C70"
    green: "#54E39A"
  fonts:
    primary: "Inter"
    alternatives:
      - "Manrope"
      - "Space Grotesk"
      - "IBM Plex Sans"

scoring:
  production_threshold: 8.0
  material_claim_min_confidence: 0.85

publishing:
  enabled: true
  mode: SCHEDULED_AUTOPILOT
  privacy_status: public
  fail_closed: true
  max_retries: 3
  require_qa_pass: true
  require_all_13_gates: true

security:
  secrets_in_repo: false
  destructive_commands: false
  default_external_write_permission: ask

audio:
  tts:
    backend: macos_say
    english_voice: Samantha
    vietnamese_voice: Linh
  sample_rate: 48000
  channels: 2
  target_lufs: -16
  ducking:
    enabled: true
    music_attenuation_db: -18
    sfx_attenuation_db: -6

render:
  encoder: videotoolbox
  fallback_encoder: libx264
  crf: 18
  preset: slow
  max_words_per_card: 6
  subtitles:
    font_name: Inter
    font_size: 42
    primary_color: "&H00FAF7F3"
    outline_color: "&H000F0A07"
    outline_width: 3
    margin_v: 240
